name: DSH Private macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Aelithis/deepseek-harness'
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 11.28.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: 核对平台并安装锁定依赖
        run: |
          test "$(uname -m)" = arm64
          pnpm install --frozen-lockfile
      - name: 构建个人版 DMG
        run: pnpm run package:desktop:mac:arm64:unsigned
      - name: 检查安装内容及回传检测能力
        run: |
          node --test apps/desktop/tests/private-runtime.node.test.mjs
          node apps/desktop/scripts/verify-private-runtime.mjs apps/desktop/.desktop-build/targets/mac-arm64/dsh apps/desktop/lib
      - name: 保存源码、工具与依赖记录
        run: node apps/desktop/scripts/private-build-manifest.mjs
      - name: 记录安装包构建来源
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: apps/desktop/.desktop-build/private-distribution/*.dmg
      - name: 上传安装包与核对记录
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DSH-Private-mac-arm64-${{ github.sha }}
          path: apps/desktop/.desktop-build/private-distribution/*
          if-no-files-found: error
          retention-days: 30
